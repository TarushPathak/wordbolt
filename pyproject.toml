[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wordbolt"
version = "8.0.0"
description = "Social Engineering Based Wordlist Generator Tool — targeted password wordlist generator"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tarush Adesh Pathak"}
]
requires-python = ">=3.8"

[project.urls]
Source = "https://github.com/TarushPathak/wordbolt"

[tool.setuptools.packages.find]
include = ["wordbolt*"]
